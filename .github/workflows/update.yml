name: Update Red Sox News RSS

on:
  workflow_dispatch:

  schedule:
    - cron: "33 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update Red Sox news
        run: python main.py

      - name: Commit generated RSS and data
        run: |
          git config user.name "Red Sox News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Red Sox News"
            git push
          fi
